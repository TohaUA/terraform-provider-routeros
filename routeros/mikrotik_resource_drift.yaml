/container:
  - tf: tag
    mt: repo
  - tf: envlist
    mt: envlists
/container/config:
  - tf: ram_high
    mt: memory-high
/container/envs:
  - tf: name
    mt: list
/interface/bridge:
  - tf: last_member_interval
    mt: last-member-query-interval
/interface/dot1x/server:
  - tf: reauth_timeout
    mt: reauth-period
/interface/vxlan:
  - tf: vrf
    mt: vtep-vrf
/interface/wireguard/peers:
  - tf: is_responder
    mt: responder
/ip/dhcp-server:
  - tf: src_address
    mt: server-address
# Deliberately no entry for /ip/ssh (always-allow-password-login -> password-authentication).
# That change is not a plain rename: the new key is a tri-state (no / yes / yes-if-no-key) that a
# bool cannot carry, so routeros_ip_ssh_server exposes it as its own `password_authentication`
# attribute instead. A drift entry here would swallow the key before the schema lookup and leave
# `password_authentication` empty on every read. Do not reintroduce it on an upstream sync.
/ip/service:
  - tf: address
    mt: available-from
/routing/bgp/connection:
  - tf: address_families
    mt: afi
/routing/bgp/template:
  - tf: address_families
    mt: afi
/routing/ospf/area:
  - tf: nssa_translate
    mt: nssa-translator
