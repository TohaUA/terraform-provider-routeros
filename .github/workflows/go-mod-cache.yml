name: Go mod cache management

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - "main"
      - "devel"
    paths:
      - "main.go"
      - "routeros/*.go"
      # The toolchain comes from go.mod and the cache key hashes go.sum, so a
      # change to either is exactly when the cache needs rebuilding.
      - "go.mod"
      - "go.sum"
      # Dependabot bumps the pinned actions below; run them before merging.
      - ".github/workflows/go-mod-cache.yml"

jobs:
  go-cache:
    name: Go Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Setup Go environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true
        id: go

      - name: Get dependencies
        shell: bash
        run: go mod download all

      - name: Cache Go Modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
