# Throwaway probe. Delete once the 7.24 migration has settled.
#
# Boots CHR 7.16 (the last version the old matrix tested) and 7.24 side by side
# and dumps the menus behind every acceptance-test failure, so the fixes come
# from what the device reports rather than from inference. Diffing the two
# outputs is what separates "MikroTik changed this" from "the test was wrong".
#
# REST is disabled on a fresh CHR: .github/scripts/setup_routeros.go creates the
# certificate and enables www-ssl/api-ssl, which is why it runs before any query.
name: RouterOS probe

on:
  push:
    branches:
      - 'ci/ros-probe'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["7.16", "7.24"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build ${{ matrix.version }}
        run: |
          cat > /tmp/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.22.1
          ARG VERSION
          RUN apk add --no-cache qemu-x86_64 qemu-system-x86_64 busybox-extras \
              iproute2 iputils bridge-utils iptables jq bash python3 libarchive-tools netcat-openbsd
          WORKDIR /routeros
          RUN wget -qO- "https://download.mikrotik.com/routeros/${VERSION}/chr-${VERSION}.vdi.zip" \
              | bsdtar -C /routeros/ -xf-
          ENV ROUTEROS_IMAGE="chr-${VERSION}.vdi"
          ADD ["./scripts", "/routeros"]
          DOCKERFILE
          docker build --build-arg VERSION=${{ matrix.version }} \
            -f /tmp/Dockerfile -t routeros-probe .github/docker-routeros

      - name: Boot ${{ matrix.version }}
        run: |
          docker run -d --name ros \
            --cap-add=NET_ADMIN --device /dev/net/tun --device /dev/kvm \
            -p 443:443 -p 8728:8728 -p 8729:8729 \
            --entrypoint /routeros/entrypoint_with_four_interfaces.sh \
            routeros-probe
          deadline=$((SECONDS + 600))
          until docker logs ros 2>&1 | grep -q MikroTik; do
            if [ "$SECONDS" -ge "$deadline" ]; then docker logs ros 2>&1 | tail -40; exit 1; fi
            sleep 10
          done
          echo "RouterOS ${{ matrix.version }} booted"

      # Without this REST stays disabled and every query below returns nothing.
      - name: Enable the API and REST services
        run: go run .github/scripts/setup_routeros.go
        env:
          ROS_USERNAME: admin
          ROS_PASSWORD: ''
          ROS_IP_ADDRESS: 127.0.0.1

      - name: Menus behind each 7.24 failure
        run: |
          get() {
            echo "----- $1 -----"
            code=$(curl -sk -o /tmp/o.json -w '%{http_code}' -u admin: "https://127.0.0.1/rest$1")
            echo "HTTP $code"
            jq -S . /tmp/o.json 2>/dev/null || cat /tmp/o.json
          }
          echo "=========== ${{ matrix.version }} ==========="
          get /system/package
          get /system/resource
          get /interface/veth
          get /interface/ovpn-server/server
          get /routing/bgp/connection
          get /routing/bgp/instance
          get /routing/bgp/vpn
          get /interface/bridge/port
          get /ip/ipsec/key
          get /interface/vxlan
          get /ip/ssh
          get /system/logging/action

      - name: RouterOS logs
        if: failure()
        run: docker logs ros 2>&1 | tail -100
